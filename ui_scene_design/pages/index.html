<!doctype html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江湖有田 · 山庄主场景</title>
    <style id="theme-vars">
:root {
  --game-background: #1f2520;
  --game-foreground: #f3ead3;
  --game-card: #efe3c2;
  --game-card-foreground: #2a2b23;
  --game-primary: #b54432;
  --game-primary-foreground: #fff8df;
  --game-muted: #6e806d;
  --game-muted-foreground: #516052;
  --game-border: #7f6244;
  --game-ring: #d8a84e;
  --game-radius-sm: 2px;
  --game-radius-md: 4px;
  --game-radius-lg: 8px;
  --game-font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --game-font-pixel: "Kenney Future", "Noto Sans SC", sans-serif;

  --ink: #252a24;
  --paper: #f3ead3;
  --paper-deep: #e3d2aa;
  --wood: #704b31;
  --wood-dark: #3b2b22;
  --jade: #315c4b;
  --bamboo: #78985c;
  --vermilion: #b54432;
  --gold: #d8a84e;
  --mist: #b8c4aa;
  --bg: #1f2520;
  --brand: #b54432;
  --ring: #d8a84e;
}


    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--game-background);
    --color-foreground: var(--game-foreground);
    --color-card: var(--game-card);
    --color-card-foreground: var(--game-card-foreground);
    --color-primary: var(--game-primary);
    --color-primary-foreground: var(--game-primary-foreground);
    --color-muted: var(--game-muted);
    --color-muted-foreground: var(--game-muted-foreground);
    --color-border: var(--game-border);
    --color-ring: var(--game-ring);
    --radius-sm: var(--game-radius-sm);
    --radius-md: var(--game-radius-md);
    --radius-lg: var(--game-radius-lg);
  }
  @layer base {
    body { background: var(--game-background); color: var(--game-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--game-background); }
      .text-background { color: var(--game-background); }
      .border-background { border-color: var(--game-background); }
      .ring-background { --tw-ring-color: var(--game-background); }
      .bg-foreground { background-color: var(--game-foreground); }
      .text-foreground { color: var(--game-foreground); }
      .border-foreground { border-color: var(--game-foreground); }
      .ring-foreground { --tw-ring-color: var(--game-foreground); }
      .bg-card { background-color: var(--game-card); }
      .text-card { color: var(--game-card); }
      .border-card { border-color: var(--game-card); }
      .ring-card { --tw-ring-color: var(--game-card); }
      .bg-card-foreground { background-color: var(--game-card-foreground); }
      .text-card-foreground { color: var(--game-card-foreground); }
      .border-card-foreground { border-color: var(--game-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--game-card-foreground); }
      .bg-primary { background-color: var(--game-primary); }
      .text-primary { color: var(--game-primary); }
      .border-primary { border-color: var(--game-primary); }
      .ring-primary { --tw-ring-color: var(--game-primary); }
      .bg-primary-foreground { background-color: var(--game-primary-foreground); }
      .text-primary-foreground { color: var(--game-primary-foreground); }
      .border-primary-foreground { border-color: var(--game-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--game-primary-foreground); }
      .bg-muted { background-color: var(--game-muted); }
      .text-muted { color: var(--game-muted); }
      .border-muted { border-color: var(--game-muted); }
      .ring-muted { --tw-ring-color: var(--game-muted); }
      .bg-muted-foreground { background-color: var(--game-muted-foreground); }
      .text-muted-foreground { color: var(--game-muted-foreground); }
      .border-muted-foreground { border-color: var(--game-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--game-muted-foreground); }
      .bg-border { background-color: var(--game-border); }
      .text-border { color: var(--game-border); }
      .border-border { border-color: var(--game-border); }
      .ring-border { --tw-ring-color: var(--game-border); }
      .bg-ring { background-color: var(--game-ring); }
      .text-ring { color: var(--game-ring); }
      .border-ring { border-color: var(--game-ring); }
      .ring-ring { --tw-ring-color: var(--game-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <main class="game-board" data-viewport-mode="app-shell">
    <section class="scene-shell is-night weather-clear" data-season="autumn" data-weather="clear" data-time="night" aria-label="山庄主场景">
      <div class="map-layer">
        <img src="../assets/village-map.png" alt="像素风村落、农田、房屋与城堡地图" class="map-art">
        <div class="map-wash"></div>
        <div class="scene-ornament distant-ridge" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="scene-ornament flag-line" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="scene-ornament bamboo-fence" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
        <div class="micro-structure gate-arch" aria-label="山门牌楼装饰"><b>山门</b><i></i><i></i><em></em></div>
        <div class="micro-structure herb-hut" aria-label="药庐装饰"><b>药庐</b><i></i><i></i><em></em></div>
        <div class="micro-structure tea-shelter" aria-label="茶棚装饰"><b>茶棚</b><i></i><em></em></div>
        <div class="stone-lantern lantern-one" aria-hidden="true"><i></i><b></b></div>
        <div class="stone-lantern lantern-two" aria-hidden="true"><i></i><b></b></div>
        <button class="landmark landmark-farm" data-dom-id="landmark-farm" aria-label="灵芝田">
          <span class="landmark-pin">田</span><span class="landmark-label">灵芝田</span>
        </button>
        <button class="landmark landmark-workshop" data-dom-id="landmark-workshop" aria-label="铁匠工坊">
          <span class="landmark-pin">炉</span><span class="landmark-label">铁匠工坊</span>
        </button>
        <button class="landmark landmark-gate" data-dom-id="landmark-gate" aria-label="山门">
          <span class="landmark-pin">门</span><span class="landmark-label">山门</span>
        </button>
        <div class="player-marker" aria-label="当前角色位置"><span></span></div>
      </div>

      <header class="top-hud">
        <div class="brand-lockup"><span class="brand-seal">田</span><div><strong>江湖有田</strong><small>月夜归园 · 半亩心田</small></div></div>
        <div class="hud-center"><span class="weather-dot"></span><span>秋分 · 晴</span><span class="hud-chip season-chip">秋夜</span><span class="hud-chip weather-chip">晴</span><span class="hud-divider"></span><span>第 03 日  18:42</span></div>
          <div class="weather-dial panel" aria-label="天候簿">
            <div class="dial-heading"><span>天候簿</span><small>山庄时辰</small></div>
            <div class="dial-readout"><strong id="dial-time-label">秋夜</strong><span id="dial-weather-label">晴</span><small id="dial-day-label">第 03 日 · 18:42</small></div>
            <div class="dial-actions"><button class="dial-button" id="btn-time-cycle" data-dom-id="btn-time-cycle" aria-label="切换昼夜" aria-pressed="false">昼夜</button><button class="dial-button" id="btn-weather-cycle" data-dom-id="btn-weather-cycle" aria-label="切换晴雨" aria-pressed="false">雨晴</button></div>
          </div>
        <div class="top-actions"><button class="icon-button" data-dom-id="btn-map" aria-label="打开地图">图</button><button class="icon-button" data-dom-id="btn-settings" aria-label="打开设置">设</button></div>
      </header>

      <aside class="left-stack">
        <section class="player-card panel">
          <div class="portrait" aria-label="沈归舟像素侠客头像"><i class="portrait-hair"></i><i class="portrait-ribbon"></i><i class="portrait-face"></i><i class="portrait-collar"></i><i class="portrait-bracer"></i><span>侠</span></div>
          <div class="player-meta"><strong>沈归舟</strong><span>初入江湖 · Lv. 03</span><div class="stat-bars"><label>气力</label><i><b style="width:78%"></b></i><em>78/100</em><label>心境</label><i><b class="calm" style="width:92%"></b></i><em>晴朗</em></div></div>
        </section>
        <section class="resource-panel panel"><div class="panel-title"><span>山庄物资</span><small>今日</small></div><div class="resource-row"><span class="resource-icon coin">两</span><div><small>银两</small><strong>120</strong></div><span class="resource-trend">+18</span></div><div class="resource-row"><span class="resource-icon herb">菇</span><div><small>灵芝菌种</small><strong>5</strong></div><span class="resource-trend">+2</span></div><div class="resource-row"><span class="resource-icon wood">木</span><div><small>山林木料</small><strong>32</strong></div><span class="resource-trend muted">—</span></div></section>
      </aside>

      <aside class="right-stack">
        <section class="quest-panel panel"><div class="panel-title"><span>当前行程</span><button class="text-button">全部</button></div><div class="quest-main"><span class="quest-mark">!</span><div><strong>修复山庄</strong><p>前往山门，寻找失落的门栓</p></div></div><div class="quest-progress"><div><span>完成度</span><strong>2 / 4</strong></div><i><b style="width:50%"></b></i></div></section>
        <section class="notice-panel panel"><span class="notice-icon">铃</span><div><small>村民来信</small><strong>阿禾在灵芝田等你</strong><p>“今晚月色好，正适合播种。”</p></div></section>
      </aside>

      <div class="context-chip"><span class="context-key">F</span><div><strong>山门</strong><small>查看损坏的门栓</small></div><span class="context-arrow">→</span></div>

      <footer class="bottom-hud">
        <div class="quickbar panel tool-table"><div class="quick-slot active"><span class="slot-key">1</span><span class="slot-glyph">锄</span><small>锄头</small></div><div class="quick-slot"><span class="slot-key">2</span><span class="slot-glyph">种</span><small>菌种</small></div><div class="quick-slot"><span class="slot-key">3</span><span class="slot-glyph">剑</span><small>木剑</small></div><div class="quick-slot"><span class="slot-key">4</span><span class="slot-glyph">灯</span><small>灯笼</small></div><div class="quick-slot"><span class="slot-key">5</span><span class="slot-glyph">包</span><small>行囊</small></div></div>
        <div class="control-hint panel"><span><b>WASD</b> 移动</span><span><b>E</b> 播种</span><span><b>Q</b> 练功</span><span><b>F</b> 互动</span><span><b>T</b> 睡觉</span></div>
        <div class="mini-status panel"><span class="moon">月</span><div><small>山庄状态</small><strong>尚待修复</strong></div><span class="status-dot"></span></div>
      </footer>
    </section>
  </main>
  <script>
    const scene = document.querySelector('.scene-shell');
    const timeButton = document.getElementById('btn-time-cycle');
    const weatherButton = document.getElementById('btn-weather-cycle');
    const timeLabel = document.getElementById('dial-time-label');
    const weatherLabel = document.getElementById('dial-weather-label');
    const weatherDot = document.querySelector('.weather-dot');

    document.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => btn.classList.toggle('pressed')));
    timeButton.addEventListener('click', () => {
      const isDay = scene.dataset.time === 'day';
      scene.dataset.time = isDay ? 'night' : 'day';
      scene.classList.toggle('is-day', !isDay);
      scene.classList.toggle('is-night', isDay);
      timeButton.setAttribute('aria-pressed', String(!isDay));
      timeLabel.textContent = isDay ? '秋夜' : '秋昼';
    });
    weatherButton.addEventListener('click', () => {
      const isRain = scene.dataset.weather === 'rain';
      scene.dataset.weather = isRain ? 'clear' : 'rain';
      scene.classList.toggle('weather-rain', !isRain);
      scene.classList.toggle('weather-clear', isRain);
      weatherButton.setAttribute('aria-pressed', String(!isRain));
      weatherLabel.textContent = isRain ? '晴' : '雨';
      weatherDot.classList.toggle('rain-dot', !isRain);
    });
  </script>
</body>
</html>
